version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://astra:astra123@db:5432/astra_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
    networks:
      - astra-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build: .
    environment:
      - DATABASE_URL=postgresql://astra:astra123@db:5432/astra_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - api
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
    networks:
      - astra-network
    command: celery -A celery_app worker --loglevel=info

  celery-beat:
    build: .
    environment:
      - DATABASE_URL=postgresql://astra:astra123@db:5432/astra_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - api
    networks:
      - astra-network
    command: celery -A celery_app beat --loglevel=info

  flower:
    build: .
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - celery-worker
    networks:
      - astra-network
    command: celery -A celery_app flower --port=5555 --address=0.0.0.0

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra123
      POSTGRES_DB: astra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - astra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - astra-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@astra.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - astra-network

volumes:
  postgres_data:
  redis_data:

networks:
  astra-network:
    driver: bridge
