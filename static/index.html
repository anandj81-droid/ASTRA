<!-- ────────────────────────────────────────────────────────── -->
<!-- 1. CURRENCY DASHBOARD SECTION                            -->
<!-- ────────────────────────────────────────────────────────── -->

<section id="currency-dashboard" class="mt-8">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold">🌍 Real-Time FX Rates</h2>
        <div class="flex gap-2">
            <button onclick="refreshRates()" class="btn btn-secondary">🔄 Refresh</button>
            <button onclick="showCurrencyModal()" class="btn btn-primary">➕ Add Currency</button>
        </div>
    </div>
    
    <div id="currency-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- Dynamic currency cards rendered by JavaScript -->
    </div>
</section>

<!-- ────────────────────────────────────────────────────────── -->
<!-- 2. RULE MANAGEMENT SECTION                               -->
<!-- ────────────────────────────────────────────────────────── -->

<section id="rule-management" class="mt-8">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold">🤖 Your Agent Rules</h2>
        <button onclick="showRuleModal()" class="btn btn-primary">➕ Create Rule</button>
    </div>
    
    <div id="rule-list" class="space-y-4">
        <!-- Dynamic rule cards rendered by JavaScript -->
    </div>
</section>

<!-- ────────────────────────────────────────────────────────── -->
<!-- 3. PREDICTIONS SECTION                                   -->
<!-- ────────────────────────────────────────────────────────── -->

<section id="predictions" class="mt-8">
    <h2 class="text-2xl font-bold mb-4">📈 AI Predictions</h2>
    
    <div id="prediction-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Prediction cards rendered by JavaScript -->
    </div>
</section>

<!-- ────────────────────────────────────────────────────────── -->
<!-- 4. MODALS FOR CURRENCY/RULE MANAGEMENT                   -->
<!-- ────────────────────────────────────────────────────────── -->

<!-- Add Currency Modal -->
<div id="currencyModal" class="modal hidden">
    <div class="modal-content">
        <h3 class="text-xl font-bold mb-4">Add New Currency</h3>
        <form id="currencyForm">
            <div class="mb-3">
                <label>Currency Code (e.g., EUR)</label>
                <input type="text" id="currencyCode" required maxlength="3" 
                       class="w-full p-2 border rounded">
            </div>
            <div class="mb-3">
                <label>Currency Name</label>
                <input type="text" id="currencyName" required 
                       class="w-full p-2 border rounded">
            </div>
            <div class="mb-3">
                <label>Symbol (e.g., €)</label>
                <input type="text" id="currencySymbol" required 
                       class="w-full p-2 border rounded">
            </div>
            <div class="mb-3">
                <label>Flag Emoji (e.g., 🇪🇺)</label>
                <input type="text" id="currencyFlag" 
                       class="w-full p-2 border rounded">
            </div>
            <div class="mb-3">
                <label>
                    <input type="checkbox" id="isBase"> Base Currency
                </label>
                <p class="text-sm text-gray-500">Base currencies are used as reference for all pairs</p>
            </div>
            <div class="mb-3">
                <label>Historical Data Days</label>
                <input type="number" id="historicalDays" value="30" 
                       class="w-full p-2 border rounded">
                <p class="text-sm text-gray-500">Days of historical data to collect for predictions</p>
            </div>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeModal('currencyModal')" 
                        class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary">Add Currency</button>
            </div>
        </form>
    </div>
</div>

<!-- Rule Modal -->
<div id="ruleModal" class="modal hidden">
    <div class="modal-content">
        <h3 class="text-xl font-bold mb-4">Create New Rule</h3>
        <form id="ruleForm">
            <div class="mb-3">
                <label>Currency Pair</label>
                <select id="rulePair" required class="w-full p-2 border rounded">
                    <!-- Options populated by JavaScript -->
                </select>
            </div>
            <div class="mb-3">
                <label>Rule Type</label>
                <select id="ruleType" required class="w-full p-2 border rounded"
                        onchange="toggleRuleFields()">
                    <option value="target_rate">Target Rate</option>
                    <option value="predictive">AI Predictive</option>
                    <option value="schedule">Scheduled</option>
                </select>
            </div>
            <div class="mb-3" id="targetRateField">
                <label>Target Rate</label>
                <input type="number" step="0.0001" id="targetRate" 
                       class="w-full p-2 border rounded">
                <p class="text-sm text-gray-500">Execute when rate reaches or exceeds this value</p>
            </div>
            <div class="mb-3" id="scheduleFields" style="display:none">
                <label>Schedule Day of Month</label>
                <input type="number" min="1" max="31" id="scheduleDay" 
                       class="w-full p-2 border rounded">
                <label class="mt-2">Schedule Time (HH:MM)</label>
                <input type="time" id="scheduleTime" 
                       class="w-full p-2 border rounded">
            </div>
            <div class="mb-3">
                <label>Amount (in base currency)</label>
                <input type="number" step="0.01" id="ruleAmount" required 
                       class="w-full p-2 border rounded">
            </div>
            <div class="mb-3" id="predictiveFields">
                <label>Min Confidence (%)</label>
                <input type="number" min="0" max="100" id="minConfidence" value="70" 
                       class="w-full p-2 border rounded">
                <p class="text-sm text-gray-500">Minimum AI confidence required for execution</p>
            </div>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeModal('ruleModal')" 
                        class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary">Create Rule</button>
            </div>
        </form>
    </div>
</div>
